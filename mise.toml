[settings]
lockfile = true

[tools]
lefthook = "latest"
go = "1.26"

[hooks]
postinstall = "lefthook install"

[tasks.install]
description = "Install client dependencies"
run = 'cd apps/client && bun install --frozen-lockfile'

[tasks.check]
description = "Run the full quality gate: every Go module, then the client"
run = "sh ./scripts/check.sh"

[tasks.check-go]
description = "Run the Go half of the quality gate"
run = "sh ./scripts/check.sh --go-only"

[tasks.format]
description = "Format the Go sources in place"
run = "sh ./scripts/check.sh --format"

[tasks.muse]
description = "Re-pin muse at a tag and re-run the client gate — mise run muse 0.4.0"
# A script file, not an inline block: mise hands a multi-line `run` to `sh -c`, which binds
# the first operand to `$0`, so `$1` arrives empty — and its `{{arg()}}` template does not
# parse in this mise version. A one-line `run` passes arguments through intact.
run = "sh ./scripts/muse-upgrade.sh"
