services:
  mycelium:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
    - '8420'
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PORT: '8420'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      PASSWORD: ${PASSWORD}
      SSO_ONLY: ${SSO_ONLY:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      ANTENNE_URL: ${ANTENNE_URL:-}
      ANTENNE_SECRET: ${ANTENNE_SECRET:-}
      ANTENNE_USER_EMAIL: ${ANTENNE_USER_EMAIL:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      JOURNAL_BROWSER_URL: ${JOURNAL_BROWSER_URL:-}
      JOURNAL_BROWSER_KEY: ${JOURNAL_BROWSER_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL-all-minilm}
      VECTOR_STORE: ${VECTOR_STORE-flat}
      QDRANT_URL: ${QDRANT_URL-http://qdrant:6333}
    volumes:
    - mycelium-data:/data
    networks:
    - default
    - dokploy-network
    - facile-ai
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.mycelium-web.rule: Host(`mycelium.facile.studio`)
      traefik.http.routers.mycelium-web.entrypoints: web
      traefik.http.routers.mycelium-web.middlewares: redirect-to-https@file
      traefik.http.routers.mycelium-web.service: mycelium-svc
      traefik.http.routers.mycelium-secure.rule: Host(`mycelium.facile.studio`)
      traefik.http.routers.mycelium-secure.entrypoints: websecure
      traefik.http.routers.mycelium-secure.tls.certresolver: letsencrypt
      traefik.http.routers.mycelium-secure.service: mycelium-svc
      traefik.http.services.mycelium-svc.loadbalancer.server.port: '8420'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '8420'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  mycelium-data: null
networks:
  dokploy-network:
    external: true
  facile-ai:
    external: true
