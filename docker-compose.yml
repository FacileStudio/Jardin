services:
  jardin-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATA_DIR=/data
      - PASSWORD=${PASSWORD}
    volumes:
      - jardin-data:/data
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.jardin-api.rule=Host(`jardin.facile.studio`) && PathPrefix(`/api`)
      - traefik.http.routers.jardin-api.entrypoints=websecure
      - traefik.http.routers.jardin-api.tls.certResolver=letsencrypt
      - traefik.http.routers.jardin-api.priority=10
      - traefik.http.services.jardin-api.loadbalancer.server.port=8420
    restart: unless-stopped

  jardin-client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    environment:
      - ORIGIN=https://jardin.facile.studio
      - BODY_SIZE_LIMIT=Infinity
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.jardin-client.rule=Host(`jardin.facile.studio`)
      - traefik.http.routers.jardin-client.entrypoints=websecure
      - traefik.http.routers.jardin-client.tls.certResolver=letsencrypt
      - traefik.http.routers.jardin-client.priority=1
      - traefik.http.services.jardin-client.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  jardin-data:

networks:
  internal:
  dokploy-network:
    external: true
