services:
  mycelium-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATA_DIR=/data
      - PASSWORD=${PASSWORD}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}
      - OIDC_SUCCESS_URL=${OIDC_SUCCESS_URL:-}
      - SSO_ONLY=${SSO_ONLY:-}
    volumes:
      - mycelium-data:/data
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.mycelium-api.rule=Host(`mycelium.facile.studio`) && PathPrefix(`/api`)
      - traefik.http.routers.mycelium-api.entrypoints=websecure
      - traefik.http.routers.mycelium-api.tls.certResolver=letsencrypt
      - traefik.http.routers.mycelium-api.priority=10
      - traefik.http.services.mycelium-api.loadbalancer.server.port=8420
    restart: unless-stopped

  mycelium-client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    environment:
      - ORIGIN=https://mycelium.facile.studio
      - BODY_SIZE_LIMIT=Infinity
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.mycelium-client.rule=Host(`mycelium.facile.studio`)
      - traefik.http.routers.mycelium-client.entrypoints=websecure
      - traefik.http.routers.mycelium-client.tls.certResolver=letsencrypt
      - traefik.http.routers.mycelium-client.priority=1
      - traefik.http.services.mycelium-client.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  mycelium-data:

networks:
  internal:
  dokploy-network:
    external: true
