services:
  jardin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8420"
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PORT: "8420"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      PASSWORD: ${PASSWORD}
      SSO_ONLY: ${SSO_ONLY:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      # Bus configuration. Setting ANTENNE_URL is enough to turn emitting on;
      # these override whatever is in the data dir, so a container is
      # reproducible from this file and does not depend on somebody having
      # opened the dashboard. Leave them unset to configure it from the UI.
      ANTENNE_URL: ${ANTENNE_URL:-}
      ANTENNE_SECRET: ${ANTENNE_SECRET:-}
      ANTENNE_USER_EMAIL: ${ANTENNE_USER_EMAIL:-}
      # Journal log shipping (optional — per-app key from Journal's Keys page;
      # Jardin is not on journal's docker network, so use https://journal.facile.studio/api)
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      # Semantic memory search. OLLAMA_URL is the switch: unset leaves the
      # feature dormant and memory search stays lexical-only. The three others
      # are refused without it rather than silently ignored, so they are passed
      # empty here and internal/env supplies the defaults (bge-m3, flat).
      # ollama and qdrant are NOT services of this stack — see the facile-ai
      # network below and docs/deployment.md.
      OLLAMA_URL: ${OLLAMA_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      VECTOR_STORE: ${VECTOR_STORE:-}
      QDRANT_URL: ${QDRANT_URL:-}
    volumes:
      - jardin-data:/data
    networks:
      - default
      - dokploy-network
      - facile-ai
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.jardin-web.rule: "Host(`jardin.facile.studio`)"
      traefik.http.routers.jardin-web.entrypoints: web
      traefik.http.routers.jardin-web.middlewares: redirect-to-https@file
      traefik.http.routers.jardin-web.service: jardin-svc
      traefik.http.routers.jardin-secure.rule: "Host(`jardin.facile.studio`)"
      traefik.http.routers.jardin-secure.entrypoints: websecure
      traefik.http.routers.jardin-secure.tls.certresolver: letsencrypt
      traefik.http.routers.jardin-secure.service: jardin-svc
      traefik.http.services.jardin-svc.loadbalancer.server.port: "8420"
    healthcheck:
      test: ["CMD", "/jardin", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  jardin-data:

networks:
  # Traefik reaches the container here.
  dokploy-network:
    external: true
  # Shared inference sidecars — ollama (bge-m3) and qdrant — run as standalone
  # containers on la ruche, outside every app's compose project, so their model
  # and index volumes survive a redeploy of any one app. Joining this network is
  # the whole dependency: no new service, no new router, no new hostname, and
  # nothing new published. `scripts/ai-sidecars.sh` creates the network and the
  # containers, and must have run once before the first deploy that needs them —
  # compose refuses to start against a missing external network.
  facile-ai:
    external: true
