name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Install the newest published Go and use exactly that. GOTOOLCHAIN=auto resolves
# a module's "go >= X" to the newest toolchain module it can see, and on
# 2026-08-19 that was go1.26.7: listed as a module, absent from go.dev, so the
# download 404s and the job dies with nothing useful in the log. setup-go tracks
# what is actually downloadable; local stops the resolver reaching past it.
env:
  GOTOOLCHAIN: local

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: tests
        run: go test -race -count=1 ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: install
        run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check
