name: filet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# filet needs Go >= 1.26.5, and GOTOOLCHAIN=auto resolves that to the newest
# toolchain module it can see. On 2026-08-19 that became go1.26.7, which is
# listed as a module but 404s on go.dev — the newest published release is
# go1.26.6 — so installing filet failed and every check was skipped. Pinning to
# a version that exists is the fix; raise it when 1.26.7 is actually downloadable.
env:
  GOTOOLCHAIN: go1.26.6

jobs:
  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: FacileStudio/filet@v0.3.0
        with:
          version: v0.3.0
          fail-on: error
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}
