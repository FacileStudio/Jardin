name: filet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Install the newest published Go and use exactly that. filet needs >= 1.26.5,
# and GOTOOLCHAIN=auto resolved it to go1.26.7 on 2026-08-19: a toolchain module
# that is listed but 404s on go.dev, where go1.26.6 is the newest release. So
# installing filet failed and every check was skipped, with no findings to say
# why. setup-go tracks what is actually downloadable, and GOTOOLCHAIN=local
# stops the resolver reaching past it — a future version filet really needs then
# fails as "requires go >= X" rather than as a 404.
env:
  GOTOOLCHAIN: local

jobs:
  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: FacileStudio/filet@v0.3.0
        with:
          version: v0.3.0
          fail-on: error
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}
